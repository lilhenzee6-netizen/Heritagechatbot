<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heritage Polytechnic — Student Enquiry Assistant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }

  html, body {
    height: 100vh;
    height: 100dvh;
  }

  body {
    display: flex;
    background: #f5f5f5;
    overflow: hidden;
  }

  /* ---------- SIDEBAR (overlay drawer, closed by default) ---------- */
  #sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: 260px;
    height: 100vh;
    height: 100dvh;
    background: #111111;
    color: #fff;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    z-index: 30;
  }
  #sidebar.open {
    transform: translateX(0);
  }

  #sidebar-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 20;
    display: none;
  }
  #sidebar-backdrop.show {
    display: block;
  }

  #close-sidebar-btn {
    margin-left: auto;
    background: none;
    border: none;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    padding: 4px 8px;
  }

  .sidebar-header {
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.15);
    white-space: nowrap;
  }
  .school-logo {
    width: 34px; height: 34px;
    background: #fff; color: #111;
    font-weight: 700; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .sidebar-header h1 { font-size: 14px; line-height: 1.3; }
  .sidebar-header p { font-size: 11px; opacity: 0.65; }

  #new-chat-btn {
    margin: 12px;
    padding: 10px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.35);
    color: #fff;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    text-align: left;
    white-space: nowrap;
  }
  #new-chat-btn:hover { background: rgba(255,255,255,0.1); }

  #chat-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px;
  }
  .chat-item {
    padding: 10px 10px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #c9c9c9;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }
  .chat-item:hover { background: rgba(255,255,255,0.08); }
  .chat-item.active { background: rgba(255,255,255,0.16); color: #fff; }
  .chat-item .del-btn { opacity: 0; font-size: 12px; color: #999; flex-shrink: 0; }
  .chat-item:hover .del-btn { opacity: 1; }

  .sidebar-footer {
    padding: 12px 16px;
    font-size: 11px;
    opacity: 0.5;
    border-top: 1px solid rgba(255,255,255,0.15);
    white-space: nowrap;
  }

  /* ---------- MAIN ---------- */
  #main {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }

  #topbar {
    height: 54px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    background: #fff;
    border-bottom: 1px solid #ddd;
    flex-shrink: 0;
  }
  #toggle-sidebar-btn {
    border: 1px solid #ccc; background: #fff; font-size: 15px; cursor: pointer;
    color: #111; width: 32px; height: 32px; border-radius: 6px; flex-shrink: 0;
  }
  #toggle-sidebar-btn:hover { background: #f0f0f0; }
  #topbar h2 { font-size: 15px; color: #111; }
  #topbar .sub { font-size: 11px; color: #777; }

  #search-toggle-wrap {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #333;
    flex-shrink: 0;
  }
  .switch { position: relative; width: 34px; height: 18px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0;
    background: #ccc; border-radius: 18px; transition: 0.2s;
  }
  .slider::before {
    content: ""; position: absolute; height: 14px; width: 14px;
    left: 2px; bottom: 2px; background: white; border-radius: 50%; transition: 0.2s;
  }
  input:checked + .slider { background: #111; }
  input:checked + .slider::before { transform: translateX(16px); }

  #chat-window {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .message { display: flex; max-width: 80%; }
  .message.bot { align-self: flex-start; }
  .message.user { align-self: flex-end; }

  .bubble {
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .message.bot .bubble {
    background: #fff; color: #111;
    border: 1px solid #ddd; border-bottom-left-radius: 3px;
  }
  .message.user .bubble {
    background: #111; color: #fff; border-bottom-right-radius: 3px;
  }
  .sources { font-size: 11px; color: #888; margin-top: 6px; }

  #typing-indicator { padding: 0 20px 6px; display: flex; gap: 4px; }
  #typing-indicator.hidden { display: none; }
  #typing-indicator span {
    width: 6px; height: 6px; background: #111; border-radius: 50%;
    opacity: 0.4; animation: blink 1.2s infinite;
  }
  #typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  #typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

  #chat-form {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    background: #fff;
    border-top: 1px solid #ddd;
    flex-shrink: 0;
  }
  #user-input {
    flex: 1;
    border: 1px solid #ccc;
    border-radius: 22px;
    padding: 10px 16px;
    font-size: 14px;
    outline: none;
    color: #111;
  }
  #user-input:focus { border-color: #111; }
  #send-btn {
    width: 42px; height: 42px; border-radius: 50%;
    border: none; background: #111; color: #fff;
    font-size: 16px; cursor: pointer; flex-shrink: 0;
  }
  #send-btn:hover { background: #333; }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }


</style>
</head>
<body>

  <!-- ===================== SIDEBAR ===================== -->
  <div id="sidebar">
    <div class="sidebar-header">
      <div class="school-logo">HP</div>
      <div>
        <h1>Heritage Polytechnic</h1>
        <p>Student Enquiry Assistant</p>
      </div>
      <button id="close-sidebar-btn">✕</button>
    </div>
    <button id="new-chat-btn">+ New chat</button>
    <div id="chat-list"></div>
    <div class="sidebar-footer">heritagepoly.edu.ng</div>
  </div>
  <div id="sidebar-backdrop"></div>

  <!-- ===================== MAIN ===================== -->
  <div id="main">
    <div id="topbar">
      <button id="toggle-sidebar-btn">☰</button>
      <div>
        <h2 id="chat-title">New chat</h2>
        <div class="sub">Ask about departments, admissions, fees, or school news</div>
      </div>
    </div>

    <div id="chat-window"></div>

    <div id="typing-indicator" class="hidden">
      <span></span><span></span><span></span>
    </div>

    <form id="chat-form">
      <input type="text" id="user-input" placeholder="Type your question..." autocomplete="off" required />
      <button type="submit" id="send-btn">➤</button>
    </form>
  </div>

<script>
/* ============================================================
   CONFIG — Groq API key is embedded here so the site works
   automatically for anyone who visits, with nothing to paste in.
   ============================================================ */
const CONFIG = {
  GROQ_API_KEY: "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",
  // Tried in order: the strongest model first, then a faster fallback
  // if the first one is overloaded or rate-limited.
  GROQ_MODELS: ["llama-3.3-70b-versatile", "llama-3.1-8b-instant"]
};

/* ============================================================
   SCHOOL KNOWLEDGE BASE — core facts always given to the model.
   ============================================================ */
const SCHOOL_KNOWLEDGE_BASE = `
SCHOOL: Heritage Polytechnic

OVERVIEW:
Heritage Polytechnic is a privately owned polytechnic institution located
in Ikot Udota, Eket Local Government Area, Akwa Ibom State, Nigeria,
about a 10-minute drive from Eket town. It sits on over 30 hectares of
land. It was founded in 1996 (some sources say 1994) by Dr. Emmanuel J.
Ekott, a Chemical Engineer, as the Christian Continuing Education
Centre. It became the Christian Institute of Continuing Education in
1999, was renamed Heritage College in 2000/2003, and was officially
licensed as a full Polytechnic in 2010 by the National Board for
Technical Education (NBTE). It is the biggest private polytechnic in
Nigeria, offering over 32 NBTE-accredited National Diploma (ND) and
Higher National Diploma (HND) programmes across 4 faculties and 16
departments. Through a partnership with Paul University Awka (PAU), HND
graduates can also progress to B.Sc, PGD, M.Sc, and even PhD degrees
("Top-Up" programmes).

FACULTIES AND DEPARTMENTS:

1. Faculty of Management Science (5 departments):
   - Business Management
   - Accounting
   - Public Administration
   - Marketing
   - Mass Communication

2. Faculty of Environmental Studies (3 departments):
   - Building Technology / Civil Engineering
   - Estate Management
   - Quantity Surveying

3. Faculty of Engineering (4 departments):
   - Electrical and Electronics Engineering
   - Telecommunication Engineering
   - Computer Engineering
   - Control and Instrumentation Engineering

4. Faculty of Science and Technology (6 departments):
   - Biochemistry
   - Statistics
   - Microbiology
   - Computer Science
   - Environmental Biology
   - Chemistry

ADMISSION REQUIREMENTS:
- ND applicants: minimum of five (5) O'Level credit passes (SSCE/NECO/GCE)
  in relevant subjects, including English and Mathematics.
- HND applicants: must hold an ND certificate from an accredited
  institution in a related field.
- Post-UTME / Screening: the Polytechnic conducts its own screening;
  a UTME score of around 100 (this has varied by year, sometimes cited
  as 120) is generally required to be considered for admission.
- Application fee for the UTME Screening Form is around ₦2,000, paid
  through the school's online admission portal.
- Applications are done online through: https://heritagepoly.edu.ng/eportals/

STUDY MODE:
Heritage Polytechnic also runs ODFeL — Open Distance and Flexible
e-Learning — allowing students to study remotely.

STUDENT SERVICES (via the ePortal):
- Results, courseware, academic profile management
- Course registration, hostel applications, ID card requests
- Transcript/certificate/letter requests
- SIWES / one-year mandatory service registration

CONTACT / LOCATION:
- Location: Ikot Udota, Eket LGA, Akwa Ibom State, Nigeria (about 3km
  from ExxonMobil Airstrip Eket)
- Official website: https://heritagepoly.edu.ng
- Student ePortal: https://heritagepoly.edu.ng/eportals/

INSTRUCTIONS FOR THE ASSISTANT:
- Prefer this knowledge base for core facts about the school's
  structure, history and admission process. When you have a real
  answer from it (or from the live site content below, if provided),
  just give the answer plainly and confidently — do NOT tack on a
  "check the website for the most accurate info" disclaimer every
  time, that gets repetitive and undermines answers you already know.
- Only mention checking heritagepoly.edu.ng or the admissions office
  when you genuinely don't have the information (e.g. exact current
  fees, today's news, deadlines, specific staff names) — say so
  honestly in that case rather than guessing.
`;

const SYSTEM_INSTRUCTION = `You are the virtual assistant on the Heritage
Polytechnic student portal. You are a genuinely helpful, general-purpose
assistant — happy to answer any question a student throws at you: school
questions, general knowledge, simple math, definitions, comparisons
("what's the difference between X and Y"), homework help, or casual
conversation. Don't limit yourself to only school topics.

When a question is specifically about Heritage Polytechnic (departments,
admissions, courses, fees, student services, school news), use the
SCHOOL INFORMATION below as your source of truth, and be accurate rather
than guessing on details it doesn't cover. For everything else, just
answer normally like any capable assistant would.

Be friendly, clear, and concise.

SCHOOL INFORMATION:
${SCHOOL_KNOWLEDGE_BASE}`;

/* ============================================================
   STATE — persisted to this device's storage so chats survive
   closing the browser or leaving the site and coming back.
   ============================================================ */
const STORAGE_KEY = "heritage_chatbot_chats_v1";

function loadChats() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function saveChats() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
  } catch (e) {
    // storage unavailable (e.g. private browsing) — fail silently
  }
}

let chats = loadChats();
let activeChatId = chats.length ? chats[0].id : null;

function createChat() {
  const chat = { id: Date.now().toString(), title: "New chat", messages: [] };
  chats.unshift(chat);
  activeChatId = chat.id;
  saveChats();
  renderChatList();
  renderMessages();
}

function getActiveChat() {
  return chats.find(c => c.id === activeChatId);
}

function renderChatList() {
  const list = document.getElementById("chat-list");
  list.innerHTML = "";
  chats.forEach(chat => {
    const item = document.createElement("div");
    item.className = "chat-item" + (chat.id === activeChatId ? " active" : "");
    item.innerHTML = `<span>${escapeHtml(chat.title)}</span><span class="del-btn">✕</span>`;
    item.querySelector("span:first-child").addEventListener("click", () => {
      activeChatId = chat.id;
      renderChatList();
      renderMessages();
      closeSidebar();
    });
    item.querySelector(".del-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      chats = chats.filter(c => c.id !== chat.id);
      if (activeChatId === chat.id) {
        if (chats.length) { activeChatId = chats[0].id; } else { createChat(); }
      }
      saveChats();
      renderChatList();
      renderMessages();
    });
    list.appendChild(item);
  });
}

function renderMessages() {
  const chat = getActiveChat();
  const win = document.getElementById("chat-window");
  win.innerHTML = "";
  document.getElementById("chat-title").textContent = chat ? chat.title : "New chat";

  if (!chat || chat.messages.length === 0) {
    appendBubble("Hello! I'm the Heritage Polytechnic virtual assistant. Ask me about departments, admissions, courses, fees, or anything about the school.", "bot");
    return;
  }
  chat.messages.forEach(m => appendBubble(m.text, m.role, m.sources));
}

function appendBubble(text, role, sources) {
  const win = document.getElementById("chat-window");
  const wrap = document.createElement("div");
  wrap.className = `message ${role}`;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  wrap.appendChild(bubble);
  if (sources && sources.length) {
    const src = document.createElement("div");
    src.className = "sources";
    src.textContent = "Sources: " + sources.join(", ");
    wrap.appendChild(src);
  }
  win.appendChild(wrap);
  win.scrollTop = win.scrollHeight;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

/* ============================================================
   GROQ CALL
   ============================================================ */
function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

/* ============================================================
   LIVE SITE FETCH — pulls the actual current text of the school
   website so the assistant can reference real, up-to-date content
   instead of relying only on the static knowledge base above.
   Cached for the browser session so we don't re-fetch on every
   single message.
   ============================================================ */
let cachedSiteContent = null;
let siteFetchAttempted = false;

async function fetchLiveSiteContent() {
  if (siteFetchAttempted) return cachedSiteContent;
  siteFetchAttempted = true;
  try {
    // r.jina.ai is a free reader proxy that fetches a page and returns
    // clean readable text — and, unlike a direct fetch to the school
    // site, it allows cross-origin requests from the browser.
    const res = await fetch("https://r.jina.ai/https://heritagepoly.edu.ng");
    if (!res.ok) return null;
    const text = await res.text();
    cachedSiteContent = text.slice(0, 5000); // keep the prompt a reasonable size
    return cachedSiteContent;
  } catch (e) {
    return null; // silently proceed without live content if this fails
  }
}

async function callGroqOnce(model, openaiMessages) {
  const url = "https://api.groq.com/openai/v1/chat/completions";

  let lastErr;
  for (let attempt = 0; attempt < 3; attempt++) {
    if (attempt > 0) await sleep(1200);

    const response = await fetch(url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${CONFIG.GROQ_API_KEY}`
      },
      body: JSON.stringify({ model, messages: openaiMessages })
    });

    if (response.ok) {
      return response.json();
    }

    let errDetail = "";
    try {
      const errJson = await response.json();
      errDetail = errJson?.error?.message || JSON.stringify(errJson);
    } catch (e) {
      errDetail = await response.text();
    }
    const err = new Error(`API error (status ${response.status}): ${errDetail}`);
    err.status = response.status;
    lastErr = err;

    if (response.status !== 401 && response.status !== 503) {
      throw err; // not a transient blip — surface it immediately
    }
    // 401/503 — loop and retry
  }
  throw lastErr;
}

// Try each model in CONFIG.GROQ_MODELS in order, falling back if one
// is overloaded or rate-limited.
async function askGemini(question, chat) {
  const liveContent = await fetchLiveSiteContent();
  let systemText = SYSTEM_INSTRUCTION;
  if (liveContent) {
    systemText += `\n\nLIVE CONTENT FETCHED JUST NOW FROM heritagepoly.edu.ng (use this for anything current — treat it as more up to date than the knowledge base above if they conflict):\n${liveContent}`;
  }

  const openaiMessages = [{ role: "system", content: systemText }];
  chat.messages.forEach(m => {
    openaiMessages.push({
      role: m.role === "user" ? "user" : "assistant",
      content: m.text
    });
  });
  openaiMessages.push({ role: "user", content: question });

  let data = null;
  let lastErr = null;

  for (const model of CONFIG.GROQ_MODELS) {
    try {
      data = await callGroqOnce(model, openaiMessages);
      break; // success
    } catch (err) {
      if (err.status === 503 || err.status === 429) {
        lastErr = err;
        continue; // try next model
      }
      throw err;
    }
  }

  if (!data) {
    throw lastErr || new Error("All models are currently unavailable. Please try again shortly.");
  }

  const answer = data?.choices?.[0]?.message?.content ||
    "Sorry, I couldn't generate a response. Please try again.";

  return { answer, sources: [] };
}

/* ============================================================
   EVENTS
   ============================================================ */
document.getElementById("new-chat-btn").addEventListener("click", createChat);

function openSidebar() {
  document.getElementById("sidebar").classList.add("open");
  document.getElementById("sidebar-backdrop").classList.add("show");
}
function closeSidebar() {
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sidebar-backdrop").classList.remove("show");
}
document.getElementById("toggle-sidebar-btn").addEventListener("click", openSidebar);
document.getElementById("close-sidebar-btn").addEventListener("click", closeSidebar);
document.getElementById("sidebar-backdrop").addEventListener("click", closeSidebar);
// close the drawer automatically after picking/starting a chat on mobile
document.getElementById("new-chat-btn").addEventListener("click", closeSidebar);

document.getElementById("chat-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = document.getElementById("user-input");
  const question = input.value.trim();
  if (!question) return;

  let chat = getActiveChat();
  if (!chat) { createChat(); chat = getActiveChat(); }

  if (chat.messages.length === 0) {
    chat.title = question.length > 30 ? question.slice(0, 30) + "…" : question;
  }

  chat.messages.push({ role: "user", text: question });
  saveChats();
  renderMessages();
  renderChatList();
  input.value = "";

  document.getElementById("typing-indicator").classList.remove("hidden");
  document.getElementById("send-btn").disabled = true;

  try {
    const { answer, sources } = await askGemini(question, chat);
    chat.messages.push({ role: "bot", text: answer, sources });
  } catch (err) {
    chat.messages.push({ role: "bot", text: "⚠️ " + err.message });
  } finally {
    saveChats();
    document.getElementById("typing-indicator").classList.add("hidden");
    document.getElementById("send-btn").disabled = false;
    renderMessages();
  }
});

/* ============================================================
   INIT
   ============================================================ */
if (chats.length === 0) {
  createChat();
} else {
  renderChatList();
  renderMessages();
}
</script>
</body>
</html>
